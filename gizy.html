<!DOCTYPE html>

<head>

    <style>
        body {

        }

</head>
<body class="bg-white text-gray-800">

    <nav class="fixed top-0 left-0 w-full z-50 py-5">

        <!-- Lapisan Kaca Putih Transparan (50%) -->
        <div class="absolute inset-0 bg-white/50"></div>

        <div class="relative z-10 max-w-4xl mx-auto flex flex-col items-center">

            <h1 class="text-4xl sm:text-6xl md:text-[98px] font-black text-black tracking-tight leading-[1.1] mb-6">

            <p class="text-sm md:text-base text-gray-500 font-medium mb-8 max-w-md">

            </p>

            <!-- Bagian Tombol Aksi -->
            <div class="flex flex-col sm:flex-row gap-4">
                <button 
    onclick="window.location.href='nutrikita.html'"
    class="group flex items-center text-[#FFAEAF]"
>

    </div>

    <!-- Teks Utama (Bergeser ke Kanan saat Hover) -->

        Pelajari Gizi Sehat!
    </div>

    <!-- Lingkaran Ikon Kanan (Sembunyi saat Hover) -->
    <div class="w-10 h-10 lg:w-12 lg:h-12 border border-[#FFAEAF] rounded-full flex items-center justify-center overflow-hidden transition-transform duration-300 group-hover:scale-0">
        <i class="fa-solid fa-chevron-down text-sm transition-transform duration-300 group-hover:translate-x-8 group-hover:translate-y-8"></i>

</button>
